name: flashpass
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.1
  country_flags: ^3.1.0
  flutter_tts: ^4.2.2
  provider: ^6.1.2
  permission_handler: ^11.3.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  flutter_svg: ^2.0.17
  confetti: ^0.8.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  installed_apps: ^2.1.1
  archive: ^4.2.0
  webview_flutter: ^4.14.1
  app_links: ^7.2.1
  purchases_flutter: ^10.12.0
  purchases_ui_flutter: ^10.12.0
  vibration: ^3.2.1
  csv: ^8.0.0
  file_picker: ^13.1.0
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/decks/
    - assets/flags/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 26